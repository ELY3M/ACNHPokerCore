name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # - name: Add MSBuild to PATH
      # uses: microsoft/setup-msbuild@v1

    # - name: Restore NuGet packages
      # working-directory: ${{env.GITHUB_WORKSPACE}}
      # run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    # - name: Build
      # working-directory: ${{env.GITHUB_WORKSPACE}}
      # # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      # run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /t:Publish

    # Setup the .NET SDK (runs natively on Linux)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x' # Match your project's .NET version

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet restore ${{env.SOLUTION_FILE_PATH}} -p:EnableWindowsTargeting=true
               
    - name: publish-windows
      working-directory: ${{env.GITHUB_WORKSPACE}}
      ###run: dotnet publish -c Release -f ${{ env.NETVERSION }} -p:RuntimeIdentifierOverride=win10-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:WindowsAppSDKSelfContained=true
      run: | 
        dotnet publish -c Release -r win-x64  -p:EnableWindowsTargeting=true -p:self-contained=true -p:PublishSingleFile=true -o ./publish

    - name: list publish dir
      run: ls ${{ github.workspace }}\publish\

    - name: copy csv files
      continue-on-error: true    
      run: | 
        cp -r ${{ github.workspace }}\ACNHPokerCore\VillagerDatabase ${{ github.workspace }}\publish\villager
        cp -r ${{ github.workspace }}\ACNHPokerCore\csv ${{ github.workspace }}\publish\csv        


    - name: Show Github infos
      run:  echo 'Workspace path ${{ github.workspace }} - runner.temp ${{ runner.temp }}'     
           
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      id: upload
      with:
        name: Release
        path: ${{ github.workspace }}\publish\*
        overwrite: true
        retention-days: 1

    - name: Output artifact ID
      run:  echo 'Artifact ID is ${{ steps.upload.outputs.artifact-id }}'        
        
    - name: Output Artifact URL
      run:  echo 'Artifact URL is ${{ steps.upload.outputs.artifact-url }}'
         
    - name: list all dirs 
      run: ls -R
      
    - name: Create Release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ github.token }} 
      with:
        draft: false
        prerelease: false
        release_name: ${{ steps.version.outputs.version }}
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}

    - name: Zipping up Release folder
      run: 7z a release.zip "${{ github.workspace }}\publish\"
            
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false    
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
        files: ${{ github.workspace }}\release.zip
      env:
        GITHUB_TOKEN: ${{ github.token }} 
        